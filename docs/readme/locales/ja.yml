introduction: CoLink は、日常的な同期、リモートアクセス、デバイス制御を一つの接続にまとめるクロスプラットフォームのデバイス連携ツールです。デバイスが同じ LAN 上にある場合でもインターネット経由で接続されている場合でも、安全に連携できます。
features:
  title: 機能
  items:
  - name: クリップボード同期
    description: あるデバイスでコピーし、別のデバイスで貼り付けます。プレーンテキスト、リッチテキスト、画像に対応しています。
  - name: ファイル転送
    description: デバイス間でファイルを送信します。LAN 直結転送にはサイズ制限がなく、クラウドリレーは最大 10 MB まで対応します。
  - name: テキストメッセージ
    description: メモやテキスト断片をデバイス間で即座に送信できます。
  - name: リモートファイルアクセス
    description: リモートデバイスのファイルシステムを閲覧し、接続済みデバイス間でファイルを転送できます。
  - name: リモートターミナルとデバイス制御
    description: スマートフォンから接続済みコンピューターの対話型ターミナルを開き、接続先の対応状況に応じて電源状態、メディア再生、システム音量を制御できます。
  - name: リモートカメラ
    description: 接続済みデバイスのカメラ映像をライブで確認できます。
  - name: CastBoard
    description: 別のデバイスをライブステータス表示に変えます。現在の再生情報、アルバムアート、同期歌詞（NetEase Cloud Music、QQ Music、Sogou Music、Spotify）を表示し、コンピューターの CPU、メモリ、ネットワークなどのシステム指標を同期します。
  - name: LAN 直結
    description: 同じネットワーク上のデバイスは mDNS で自動検出され、クラウドを経由せず直接接続します。
  availability_note: リモートアクセスと制御の機能は、両方のデバイスのクライアントバージョン、プラットフォーム機能、付与された権限に依存します。
