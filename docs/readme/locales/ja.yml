  connect_title: 接続
  connect_steps:
  - クライアントを開いてアカウントを登録します。
  - 同じ LAN 上では 6 桁のペアリングコードでデバイスをペアリングし、リモートではサーバーリレー経由で接続します。
  - クリップボードを同期し、ファイルやメッセージを送信するか、リモートアクセス、デバイス制御、CastBoard を利用します。
  self_hosting_title: セルフホスティング（任意）
