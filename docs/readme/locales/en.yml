  connect_title: Connect
  connect_steps:
  - Open the client and sign up.
  - Pair devices on the same LAN via the 6-digit pairing code, or connect remotely through the server relay.
  - Start syncing clipboard, sending files and messages, or using remote access, device control, and CastBoard.
  self_hosting_title: Self-hosting (Optional)
  self_hosting: You can self-host the CoLink server using Docker. See [colink-server](https://github.com/CoLinkDev/colink-server) for setup instructions.
architecture:
  title: Architecture
  headers:
    path: Communication Path
    transport: Transport
    purpose: Purpose
  rows:
  - path: Client ↔ Server
    transport: HTTPS + WSS
    purpose: Authentication, device management, cloud relay
  - path: Client ↔ Client (LAN)
    transport: mDNS + WebSocket
    purpose: Direct P2P on the same network
  server_role: REST API · WebSocket Relay
  lan_direct: Direct LAN P2P
security:
  title: Security
  items:
  - Each device has its own Ed25519 key pair as a non-forgeable cryptographic identity, with online rotation support.
  - LAN connections establish mutual trust through a four-step mutual handshake. First-time pairing uses a SHA-256-derived 6-digit pairing code to prevent MITM attacks.
  - LAN messages are end-to-end encrypted with X25519 ECDH key agreement, HKDF-SHA256 session keys, and AES-256-GCM/ChaCha20-Poly1305 AEAD.
  - JWT access tokens are valid for 15 minutes. Refresh tokens are rotated immediately after single use, and old tokens are marked revoked to detect replay.
  - The server does not persist messages, files, or clipboard contents. It only stores account and device metadata.
development:
  title: Development
  introduction: 'This project uses a multi-repository structure. Each component is maintained independently:'
  headers:
    repository: Repository
    stack: Tech Stack
    description: Description
  projects:
  - repository: colink-server
    stack: Go, Gin, GORM, PostgreSQL
    description: Backend API server and WebSocket relay
  - repository: colink-desktop
    stack: Tauri 2.x (Rust + React/TS)
    description: Desktop client for Windows, macOS, and Linux
  - repository: colink-android
    stack: Kotlin, Jetpack Compose
    description: Android client
  - repository: colink-castboard
    stack: TypeScript
    description: Standalone CastBoard project
  - repository: CoLinkProtocol
    stack: Markdown
    description: 'Protocol specifications and API documentation (hosted documentation: [CoLink Protocol](https://colinkdev.github.io/CoLinkProtocol/))'
