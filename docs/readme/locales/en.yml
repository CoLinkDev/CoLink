introduction: CoLink is a cross-platform device connectivity tool that brings everyday sync, remote access, and device control together through a single connection. Whether devices are on the same LAN or connected over the internet, they can collaborate securely.
features:
  title: Features
  items:
  - name: Clipboard Sync
    description: Copy on one device and paste on another. Supports plain text, rich text, and images.
  - name: File Transfer
    description: Send files between devices. Direct LAN transfers have no size limit; cloud relay supports up to 10 MB.
  - name: Text Messages
    description: Send notes and text snippets between devices instantly.
  - name: Remote File Access
    description: Browse the file system of a remote device and transfer files between connected devices.
  - name: Remote Terminal & Device Control
    description: Open an interactive terminal on a connected computer from your phone; depending on peer support, control power state, media playback, and system volume.
  - name: Remote Camera
    description: View live video from cameras on connected devices.
  - name: CastBoard
    description: 'Turn another device into a live status display: show now-playing information, album art, and synchronized lyrics (NetEase Cloud Music, QQ Music, Sogou Music, and Spotify), and sync CPU, memory, network, and other system metrics from your computer.'
  - name: Direct LAN Connection
    description: Devices on the same network discover each other automatically through mDNS and connect directly without going through the cloud.
  availability_note: Remote access and control features depend on the client version, platform capabilities, and granted permissions on both devices.
