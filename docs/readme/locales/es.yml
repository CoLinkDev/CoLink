  connect_title: Conectar
  connect_steps:
  - Abre el cliente y registra una cuenta.
  - Empareja dispositivos en la misma LAN con el código de 6 dígitos, o conéctalos de forma remota mediante el relé del servidor.
  - Empieza a sincronizar el portapapeles, enviar archivos y mensajes, o usa el acceso remoto, el control de dispositivos y CastBoard.
  self_hosting_title: Autoalojamiento (opcional)
  self_hosting: Puedes autoalojar el servidor de CoLink con Docker. Consulta [colink-server](https://github.com/CoLinkDev/colink-server) para ver las instrucciones de configuración.
architecture:
  title: Arquitectura
  headers:
    path: Ruta de comunicación
    transport: Transporte
    purpose: Uso
  rows:
  - path: Cliente ↔ Servidor
    transport: HTTPS + WSS
    purpose: Autenticación, gestión de dispositivos, relé en la nube
  - path: Cliente ↔ Cliente (LAN)
    transport: mDNS + WebSocket
    purpose: P2P directo en la misma red
  server_role: API REST · relé WebSocket
  lan_direct: P2P directo por LAN
security:
  title: Seguridad
  items:
  - Cada dispositivo tiene su propio par de claves Ed25519 como identidad criptográfica no falsificable, con soporte para rotación en línea.
  - Las conexiones LAN establecen confianza mutua mediante un protocolo de enlace bidireccional de cuatro pasos. El primer emparejamiento usa un código de 6 dígitos derivado con SHA-256 para evitar ataques MITM.
  - 'Los mensajes LAN están cifrados de extremo a extremo: acuerdo de claves X25519 ECDH, claves de sesión derivadas con HKDF-SHA256 y AEAD AES-256-GCM/ChaCha20-Poly1305.'
  - Los JWT Access Token son válidos durante 15 minutos. Los Refresh Token se rotan inmediatamente tras un único uso, y los tokens antiguos se marcan como revocados para detectar repetición.
  - El servidor no persiste mensajes, archivos ni contenido del portapapeles. Solo almacena metadatos de cuentas y dispositivos.
