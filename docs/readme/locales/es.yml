  headers:
    repository: Repositorio
    stack: Tecnología
    description: Descripción
  projects:
  - repository: colink-server
    stack: Go, Gin, GORM, PostgreSQL
    description: Servidor API backend y relé WebSocket
  - repository: colink-desktop
    stack: Tauri 2.x (Rust + React/TS)
    description: Cliente de escritorio para Windows, macOS y Linux
  - repository: colink-android
    stack: Kotlin, Jetpack Compose
    description: Cliente Android
  - repository: colink-castboard
    stack: TypeScript
    description: Proyecto CastBoard independiente
  - repository: CoLinkProtocol
    stack: Markdown
    description: 'Especificaciones del protocolo y documentación de API (documentación alojada: [CoLink Protocol](https://colinkdev.github.io/CoLinkProtocol/))'
