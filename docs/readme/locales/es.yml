introduction: CoLink es una herramienta multiplataforma para conectar dispositivos que reúne la sincronización diaria, el acceso remoto y el control de dispositivos en una sola conexión. Tanto si los dispositivos están en la misma LAN como si se conectan a través de internet, pueden colaborar de forma segura.
features:
  title: Funciones
  items:
  - name: Sincronización del portapapeles
    description: Copia en un dispositivo y pega en otro. Admite texto sin formato, texto enriquecido e imágenes.
  - name: Transferencia de archivos
    description: Envía archivos entre dispositivos. Las transferencias directas por LAN no tienen límite de tamaño; el relé en la nube admite hasta 10 MB.
  - name: Mensajes de texto
    description: Envía notas y fragmentos de texto entre dispositivos al instante.
  - name: Acceso remoto a archivos
    description: Explora el sistema de archivos de un dispositivo remoto y transfiere archivos entre dispositivos conectados.
  - name: Terminal remoto y control de dispositivos
    description: Abre un terminal interactivo en un ordenador conectado desde el teléfono; según la compatibilidad del dispositivo remoto, controla el estado de energía, la reproducción multimedia y el volumen del sistema.
  - name: Cámara remota
    description: Visualiza vídeo en directo de las cámaras de los dispositivos conectados.
  - name: CastBoard
    description: 'Convierte otro dispositivo en una pantalla de estado en tiempo real: muestra la reproducción actual, la carátula y letras sincronizadas (NetEase Cloud Music, QQ Music, Sogou Music y Spotify), y sincroniza CPU, memoria, red y otras métricas del sistema del ordenador.'
  - name: Conexión directa por LAN
    description: Los dispositivos de la misma red se descubren automáticamente mediante mDNS y se conectan directamente, sin pasar por la nube.
  availability_note: Las funciones de acceso remoto y control dependen de la versión del cliente, las capacidades de la plataforma y los permisos concedidos en ambos dispositivos.
