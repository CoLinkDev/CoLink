introduction: CoLink 是一款跨平台设备互联工具，将日常同步、远程访问和设备控制整合在同一套连接中。无论设备处于同一局域网还是通过互联网连接，都能安全协作。
features:
  title: 功能
  items:
  - name: 剪贴板同步
    description: 在一台设备上复制，在另一台设备上粘贴。支持纯文本、富文本和图片。
  - name: 文件传输
    description: 在设备之间发送文件。局域网传输直连无大小限制；云端中继最大支持 10 MB。
  - name: 文本消息
    description: 在设备之间即时发送笔记和文本片段。
  - name: 远程文件访问
    description: 浏览远程设备的文件系统，并在已连接设备之间传输文件。
  - name: 远程终端与设备控制
    description: 在手机上打开已连接电脑的交互式终端；按对端支持情况控制电源状态、媒体播放和系统音量。
  - name: 远程摄像头
    description: 查看已连接设备的摄像头实时画面。
  - name: CastBoard
    description: 将另一台设备变成实时状态屏：显示当前播放的音乐、专辑封面与同步歌词（支持网易云音乐、QQ音乐、搜狗音乐、Spotify），并同步电脑的 CPU、内存、网络等系统指标。
  - name: 局域网直连
    description: 同一网络下的设备通过 mDNS 自动发现并直连，完全绕过云端。
  availability_note: 远程访问与控制功能取决于两端客户端版本、平台能力和授予的权限。
