architecture:
  title: 架构
  headers:
    path: 通信路径
    transport: 传输协议
    purpose: 用途
  rows:
  - path: 客户端 ↔ 服务器
    transport: HTTPS + WSS
    purpose: 认证、设备管理、云端中继
  - path: 客户端 ↔ 客户端（局域网）
    transport: mDNS + WebSocket
    purpose: 同一网络下的直连 P2P
  server_role: REST API · WebSocket 中继
  lan_direct: 局域网直连 P2P
security:
  title: 安全性
  items:
  - 每台设备持有独立的 Ed25519 密钥对，作为不可伪造的密码学身份，支持在线轮换
  - 局域网连接通过四步双向握手建立互信，首次配对使用 SHA-256 派生的 6 位配对码防止 MITM
  - 局域网消息端到端加密：X25519 ECDH 密钥协商 + HKDF-SHA256 派生会话密钥 + AES-256-GCM/ChaCha20-Poly1305 AEAD
  - JWT Access Token 有效期 15 分钟；Refresh Token 单次使用后立即轮换，旧令牌标记撤销以检测重放
  - 服务端不持久化任何消息、文件或剪贴板内容，仅存储账户与设备元数据
development:
  title: 开发
  introduction: 本项目采用多仓库结构，各组件独立维护：
  headers:
    repository: 仓库
    stack: 技术栈
    description: 描述
  projects:
  - repository: colink-server
    stack: Go, Gin, GORM, PostgreSQL
    description: 后端 API 服务器与 WebSocket 中继
  - repository: colink-desktop
    stack: Tauri 2.x (Rust + React/TS)
    description: 桌面客户端（Windows、macOS、Linux）
  - repository: colink-android
    stack: Kotlin, Jetpack Compose
    description: Android 客户端
  - repository: colink-castboard
    stack: TypeScript
    description: 独立的 CastBoard 项目
  - repository: CoLinkProtocol
    stack: Markdown
    description: 协议规范与 API 文档（在线托管文档：[CoLink Protocol](https://colinkdev.github.io/CoLinkProtocol/)）
  clone_instruction: 将主仓库和所有子仓库克隆到同一父目录下：
  build_and_run_title: 构建与运行
