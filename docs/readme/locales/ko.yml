introduction: CoLink은 일상적인 동기화, 원격 액세스, 기기 제어를 하나의 연결로 통합하는 크로스플랫폼 기기 연결 도구입니다. 기기가 같은 LAN에 있거나 인터넷을 통해 연결되어 있어도 안전하게 협업할 수 있습니다.
features:
  title: 기능
  items:
  - name: 클립보드 동기화
    description: 한 기기에서 복사하고 다른 기기에서 붙여넣습니다. 일반 텍스트, 리치 텍스트, 이미지를 지원합니다.
  - name: 파일 전송
    description: 기기 사이에서 파일을 보냅니다. LAN 직접 전송에는 크기 제한이 없으며, 클라우드 릴레이는 최대 10 MB를 지원합니다.
  - name: 텍스트 메시지
    description: 메모와 텍스트 조각을 기기 사이에서 즉시 보냅니다.
  - name: 원격 파일 액세스
    description: 원격 기기의 파일 시스템을 탐색하고 연결된 기기 간에 파일을 전송합니다.
  - name: 원격 터미널 및 기기 제어
    description: 휴대폰에서 연결된 컴퓨터의 대화형 터미널을 열고, 상대 기기 지원 여부에 따라 전원 상태, 미디어 재생, 시스템 볼륨을 제어합니다.
  - name: 원격 카메라
    description: 연결된 기기의 카메라 영상을 실시간으로 확인합니다.
  - name: CastBoard
    description: 다른 기기를 실시간 상태 화면으로 바꿉니다. 현재 재생 정보, 앨범 아트, 동기화 가사(NetEase Cloud Music, QQ Music, Sogou Music, Spotify)를 표시하고 컴퓨터의 CPU, 메모리, 네트워크 등 시스템 지표를 동기화합니다.
  - name: LAN 직접 연결
    description: 같은 네트워크의 기기는 mDNS로 자동 발견되고 클라우드를 거치지 않고 직접 연결됩니다.
  availability_note: 원격 액세스와 제어 기능은 양쪽 기기의 클라이언트 버전, 플랫폼 기능, 부여된 권한에 따라 달라집니다.
