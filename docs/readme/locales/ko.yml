  connect_title: 연결
  connect_steps:
  - 클라이언트를 열고 계정을 등록합니다.
  - 같은 LAN에서는 6자리 페어링 코드로 기기를 페어링하거나, 서버 릴레이를 통해 원격으로 연결합니다.
  - 클립보드를 동기화하고 파일과 메시지를 보내거나, 원격 액세스, 기기 제어, CastBoard를 사용합니다.
  self_hosting_title: 셀프 호스팅(선택 사항)
  self_hosting: Docker로 CoLink 서버를 직접 호스팅할 수 있습니다. 설정 방법은 [colink-server](https://github.com/CoLinkDev/colink-server)를 참고하세요.
architecture:
  title: 아키텍처
  headers:
    path: 통신 경로
    transport: 전송 방식
    purpose: 용도
  rows:
  - path: 클라이언트 ↔ 서버
    transport: HTTPS + WSS
    purpose: 인증, 기기 관리, 클라우드 릴레이
  - path: 클라이언트 ↔ 클라이언트(LAN)
    transport: mDNS + WebSocket
    purpose: 같은 네트워크에서 직접 P2P
  server_role: REST API · WebSocket 릴레이
  lan_direct: LAN 직접 P2P
security:
  title: 보안
  items:
  - 각 기기는 위조할 수 없는 암호학적 신원으로 독립된 Ed25519 키 쌍을 보유하며, 온라인 회전을 지원합니다.
  - LAN 연결은 4단계 양방향 핸드셰이크로 상호 신뢰를 설정합니다. 최초 페어링은 MITM을 방지하기 위해 SHA-256에서 파생한 6자리 페어링 코드를 사용합니다.
  - LAN 메시지는 종단 간 암호화됩니다. X25519 ECDH 키 합의, HKDF-SHA256 파생 세션 키, AES-256-GCM/ChaCha20-Poly1305 AEAD를 사용합니다.
  - JWT Access Token은 15분 동안 유효합니다. Refresh Token은 1회 사용 직후 회전되며, 이전 토큰은 재사용 공격 감지를 위해 폐기 표시됩니다.
  - 서버는 메시지, 파일, 클립보드 내용을 영구 저장하지 않고 계정 및 기기 메타데이터만 저장합니다.
development:
  title: 개발
  introduction: 이 프로젝트는 다중 저장소 구조를 사용합니다. 각 구성 요소는 독립적으로 유지 관리됩니다.
  headers:
    repository: 저장소
    stack: 기술 스택
    description: 설명
  projects:
  - repository: colink-server
    stack: Go, Gin, GORM, PostgreSQL
    description: 백엔드 API 서버와 WebSocket 릴레이
  - repository: colink-desktop
    stack: Tauri 2.x (Rust + React/TS)
    description: Windows, macOS, Linux용 데스크톱 클라이언트
  - repository: colink-android
    stack: Kotlin, Jetpack Compose
    description: Android 클라이언트
  - repository: colink-castboard
    stack: TypeScript
    description: 독립형 CastBoard 프로젝트
  - repository: CoLinkProtocol
    stack: Markdown
    description: '프로토콜 사양과 API 문서(호스팅 문서: [CoLink Protocol](https://colinkdev.github.io/CoLinkProtocol/))'
  clone_instruction: 루트 저장소와 모든 하위 저장소를 같은 상위 디렉터리에 클론합니다.
  build_and_run_title: 빌드 및 실행
  build_and_run_instruction: 각 하위 프로젝트에는 자체 설정 안내가 있습니다. 해당 README를 참고하세요.
  readme_projects:
  - name: 서버
    path: colink-server/README.md
  - name: 데스크톱
    path: colink-desktop/README.md
  - name: Android
    path: colink-android/README.md
  - name: CastBoard
    path: colink-castboard/README.md
