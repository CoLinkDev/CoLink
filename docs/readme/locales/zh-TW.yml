introduction: CoLink 是一款跨平台裝置互聯工具，將日常同步、遠端存取和裝置控制整合在同一套連線中。無論裝置處於同一區域網路，還是透過網際網路連線，都能安全協作。
features:
  title: 功能
  items:
  - name: 剪貼簿同步
    description: 在一台裝置上複製，在另一台裝置上貼上。支援純文字、富文字和圖片。
  - name: 檔案傳輸
    description: 在裝置之間傳送檔案。區域網路直連傳輸沒有大小限制；雲端中繼最大支援 10 MB。
  - name: 文字訊息
    description: 在裝置之間即時傳送筆記和文字片段。
  - name: 遠端檔案存取
    description: 瀏覽遠端裝置的檔案系統，並在已連線裝置之間傳輸檔案。
  - name: 遠端終端機與裝置控制
    description: 從手機開啟已連線電腦的互動式終端機；依對端支援情況控制電源狀態、媒體播放和系統音量。
  - name: 遠端攝影機
    description: 查看已連線裝置的攝影機即時畫面。
  - name: CastBoard
    description: 將另一台裝置變成即時狀態顯示器：顯示目前播放資訊、專輯封面與同步歌詞（支援網易雲音樂、QQ 音樂、搜狗音樂、Spotify），並同步電腦的 CPU、記憶體、網路等系統指標。
  - name: 區域網路直連
    description: 同一網路下的裝置透過 mDNS 自動發現並直連，完全繞過雲端。
  availability_note: 遠端存取與控制功能取決於兩端用戶端版本、平台能力和授予的權限。
