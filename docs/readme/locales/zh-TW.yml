  connect_title: 連線
  connect_steps:
  - 開啟用戶端並註冊帳戶。
  - 透過 6 位配對碼在同一區域網路內配對裝置，或透過伺服器中繼遠端連線。
  - 開始同步剪貼簿、傳送檔案和訊息，或使用遠端存取、裝置控制與 CastBoard。
