architecture:
  title: 架構
  headers:
    path: 通訊路徑
    transport: 傳輸協定
    purpose: 用途
  rows:
  - path: 用戶端 ↔ 伺服器
    transport: HTTPS + WSS
    purpose: 認證、裝置管理、雲端中繼
  - path: 用戶端 ↔ 用戶端（區域網路）
    transport: mDNS + WebSocket
    purpose: 同一網路下的直連 P2P
  server_role: REST API · WebSocket 中繼
  lan_direct: 區域網路直連 P2P
security:
  title: 安全性
  items:
  - 每台裝置持有獨立的 Ed25519 金鑰對，作為不可偽造的密碼學身份，支援線上輪換
  - 區域網路連線透過四步雙向握手建立互信，首次配對使用 SHA-256 派生的 6 位配對碼防止 MITM
  - 區域網路訊息端到端加密：X25519 ECDH 金鑰協商 + HKDF-SHA256 派生工作階段金鑰 + AES-256-GCM/ChaCha20-Poly1305 AEAD
  - JWT Access Token 有效期 15 分鐘；Refresh Token 單次使用後立即輪換，舊權杖標記撤銷以偵測重放
  - 伺服器不持久化任何訊息、檔案或剪貼簿內容，僅儲存帳戶與裝置中繼資料
development:
  title: 開發
  introduction: 本專案採用多儲存庫結構，各元件獨立維護：
  headers:
    repository: 儲存庫
    stack: 技術棧
    description: 描述
  projects:
  - repository: colink-server
    stack: Go, Gin, GORM, PostgreSQL
    description: 後端 API 伺服器與 WebSocket 中繼
  - repository: colink-desktop
    stack: Tauri 2.x (Rust + React/TS)
    description: 桌面用戶端（Windows、macOS、Linux）
  - repository: colink-android
    stack: Kotlin, Jetpack Compose
    description: Android 用戶端
  - repository: colink-castboard
    stack: TypeScript
    description: 獨立的 CastBoard 專案
  - repository: CoLinkProtocol
    stack: Markdown
    description: 協定規範與 API 文件（託管文件：[CoLink Protocol](https://colinkdev.github.io/CoLinkProtocol/)）
  clone_instruction: 將主儲存庫和所有子儲存庫複製到同一父目錄下：
  build_and_run_title: 建置與執行
  build_and_run_instruction: 各子專案有各自的設定說明，請參考對應的 README：
  readme_projects:
