  connect_title: Подключение
  connect_steps:
  - Откройте клиент и зарегистрируйте аккаунт.
  - Сопрягите устройства в одной LAN с помощью 6-значного кода или подключитесь удаленно через серверный ретранслятор.
  - Начните синхронизировать буфер обмена, отправлять файлы и сообщения или используйте удалённый доступ, управление устройствами и CastBoard.
  self_hosting_title: Самостоятельный хостинг (необязательно)
  self_hosting: Сервер CoLink можно самостоятельно разместить с помощью Docker. Инструкции по настройке см. в [colink-server](https://github.com/CoLinkDev/colink-server).
architecture:
  title: Архитектура
  headers:
    path: Канал связи
    transport: Транспорт
    purpose: Назначение
  rows:
  - path: Клиент ↔ Сервер
    transport: HTTPS + WSS
    purpose: Аутентификация, управление устройствами, облачный ретранслятор
  - path: Клиент ↔ Клиент (LAN)
    transport: mDNS + WebSocket
    purpose: Прямой P2P в одной сети
  server_role: REST API · WebSocket-ретранслятор
  lan_direct: Прямой P2P по LAN
security:
  title: Безопасность
  items:
  - Каждое устройство имеет собственную пару ключей Ed25519 как неподделываемую криптографическую идентичность, с поддержкой онлайн-ротации.
  - LAN-подключения устанавливают взаимное доверие через четырехшаговое взаимное рукопожатие. При первом сопряжении используется 6-значный код, производный от SHA-256, для защиты от MITM.
  - 'LAN-сообщения шифруются сквозным шифрованием: согласование ключей X25519 ECDH, сеансовые ключи HKDF-SHA256 и AEAD AES-256-GCM/ChaCha20-Poly1305.'
  - JWT Access Token действителен 15 минут. Refresh Token ротируется сразу после однократного использования, а старые токены помечаются отозванными для обнаружения повторного воспроизведения.
  - Сервер не сохраняет сообщения, файлы или содержимое буфера обмена. Он хранит только метаданные аккаунтов и устройств.
development:
  title: Разработка
  introduction: 'Проект использует структуру из нескольких репозиториев. Каждый компонент поддерживается независимо:'
  headers:
    repository: Репозиторий
    stack: Технологии
    description: Описание
  projects:
  - repository: colink-server
    stack: Go, Gin, GORM, PostgreSQL
    description: Backend API-сервер и WebSocket-ретранслятор
  - repository: colink-desktop
    stack: Tauri 2.x (Rust + React/TS)
    description: Настольный клиент для Windows, macOS и Linux
  - repository: colink-android
    stack: Kotlin, Jetpack Compose
    description: Android-клиент
  - repository: colink-castboard
    stack: TypeScript
    description: Автономный проект CastBoard
  - repository: CoLinkProtocol
    stack: Markdown
    description: 'Спецификации протокола и документация API (размещённая документация: [CoLink Protocol](https://colinkdev.github.io/CoLinkProtocol/))'
  clone_instruction: 'Клонируйте корневой репозиторий и все подрепозитории в один родительский каталог:'
  build_and_run_title: Сборка и запуск
  build_and_run_instruction: 'У каждого подпроекта есть собственные инструкции по настройке. См. соответствующий README:'
