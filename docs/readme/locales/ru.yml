introduction: CoLink — кроссплатформенный инструмент для связи устройств, объединяющий повседневную синхронизацию, удалённый доступ и управление устройствами в одном подключении. Устройства могут безопасно взаимодействовать как в одной LAN, так и через интернет.
features:
  title: Возможности
  items:
  - name: Синхронизация буфера обмена
    description: Копируйте на одном устройстве и вставляйте на другом. Поддерживаются обычный текст, форматированный текст и изображения.
  - name: Передача файлов
    description: Отправляйте файлы между устройствами. Прямая передача по LAN не имеет ограничения размера; облачный ретранслятор поддерживает до 10 MB.
  - name: Текстовые сообщения
    description: Мгновенно отправляйте заметки и фрагменты текста между устройствами.
  - name: Удалённый доступ к файлам
    description: Просматривайте файловую систему удалённого устройства и передавайте файлы между подключёнными устройствами.
  - name: Удалённый терминал и управление устройствами
    description: Открывайте интерактивный терминал на подключённом компьютере со смартфона; в зависимости от поддержки удалённого устройства управляйте питанием, воспроизведением мультимедиа и системной громкостью.
  - name: Удалённая камера
    description: Просматривайте видео в реальном времени с камер подключённых устройств.
  - name: CastBoard
    description: 'Превратите другое устройство в экран состояния в реальном времени: отображайте текущую композицию, обложку альбома и синхронизированные тексты песен (NetEase Cloud Music, QQ Music, Sogou Music и Spotify), а также синхронизируйте CPU, память, сеть и другие системные показатели компьютера.'
  - name: Прямое подключение по LAN
    description: Устройства в одной сети автоматически обнаруживают друг друга через mDNS и подключаются напрямую, полностью минуя облако.
  availability_note: Функции удалённого доступа и управления зависят от версии клиента, возможностей платформы и выданных разрешений на обоих устройствах.
