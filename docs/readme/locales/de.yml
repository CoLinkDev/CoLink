  headers:
    repository: Repository
    stack: Technologie
    description: Beschreibung
  projects:
  - repository: colink-server
    stack: Go, Gin, GORM, PostgreSQL
    description: Backend-API-Server und WebSocket-Relay
  - repository: colink-desktop
    stack: Tauri 2.x (Rust + React/TS)
    description: Desktop-Client für Windows, macOS und Linux
  - repository: colink-android
    stack: Kotlin, Jetpack Compose
    description: Android-Client
  - repository: colink-castboard
    stack: TypeScript
    description: Eigenständiges CastBoard-Projekt
  - repository: CoLinkProtocol
    stack: Markdown
    description: 'Protokollspezifikationen und API-Dokumentation (gehostete Dokumentation: [CoLink Protocol](https://colinkdev.github.io/CoLinkProtocol/))'
