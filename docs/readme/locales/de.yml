    transport: HTTPS + WSS
    purpose: Authentifizierung, Geräteverwaltung, Cloud-Relay
  - path: Client ↔ Client (LAN)
    transport: mDNS + WebSocket
    purpose: Direktes P2P im selben Netzwerk
